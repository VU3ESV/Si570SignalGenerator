<rect class="box" x="30" y="860" width="760" height="205" rx="6"/>
<text class="h2" x="46" y="887" text-anchor="start">Notes</text>
<text class="t" x="46" y="915" text-anchor="start">Reference level at J1: a sine of +6 to +13 dBm, or a 3.3 V CMOS square wave. R1 terminates</text>
<text class="t" x="46" y="936" text-anchor="start">the coax; R2/R3 bias U1 at the centre of its worst-case switching window (about 0.95–2.04 V).</text>
<text class="t" x="46" y="957" text-anchor="start">Fit R5 and U2 within about 2 cm of the Si570 CLK+ pin. The tap adds about 4 pF behind 100 Ω.</text>
<text class="t" x="46" y="978" text-anchor="start">R8 holds U2's input low when OE switches the Si570 output off.</text>
<text class="t" x="46" y="999" text-anchor="start">GPIO34/35 are input-only and must never see more than 3.3 V. Leave D27 unconnected.</text>
<text class="t" x="46" y="1020" text-anchor="start">The ESP32 counts the sample up to 40 MHz; above that the firmware holds the last correction.</text>
<text class="t" x="46" y="1041" text-anchor="start">R7 + the chip's ~20 Ω output ≈ 50 Ω, so J2 can drive a 1 MΩ counter over coax cleanly.</text>
<rect class="box" x="810" y="860" width="420" height="205" rx="6"/>
