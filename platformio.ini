; Si570 signal generator - 30-pin ESP32-WROOM-32 DevKit (DOIT DevKit V1 style)
;
;   pio run -e esp32 -t upload        build + flash over USB (needed once: partition table)
;   pio run -e esp32-ota -t upload    build + flash over Wi-Fi (ArduinoOTA)
;   pio device monitor                serial log / console (115200)
;   pio test -e native                host unit tests (driver maths, UI logic)

[platformio]
default_envs = esp32

[env:esp32]
; pioarduino = Arduino-ESP32 core 3.1.x / ESP-IDF 5.3. The pulse counter code needs
; IDF 5 (driver/pulse_cnt.h); the stock "espressif32" registry platform is still core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; The ESP32's CP2102. Set explicitly because auto-detect picks the first known USB-serial
; adapter, and on this Mac that's an FT232R (/dev/cu.usbserial-A50285BI). Change this if
; the board's USB chip differs (CH340 boards show up as /dev/cu.wchusbserial*).
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
; Two 1.9 MB app slots so OTA has room (the default table has 1.25 MB slots).
board_build.partitions = min_spiffs.csv
; The web page, embedded in the firmware so an OTA update also updates the page.
board_build.embed_txtfiles = web/index.html
lib_deps =
    olikraus/U8g2@^2.36.5
    duinowitchery/hd44780@^1.3.2
    links2004/WebSockets@^2.6.1
    ; GPL-3.0: firmware binaries that include it are GPL-3.0 as a whole
    etherkit/Etherkit Si5351@^2.4.0
build_flags = -Wall
; Writes include/build_stamp.h on every build, so /status and the boot banner show
; which build is running (useful after an OTA update).
extra_scripts = pre:tools/build_stamp.py
test_ignore = test_*

; Over-the-air upload. Set the admin password (if any) in SIGGEN_ADMIN_PASSWORD, and
; override the address with --upload-port if mDNS doesn't resolve on your network.
[env:esp32-ota]
extends = env:esp32
upload_protocol = espota
upload_port = Si570-SigGen.local
upload_flags =
    --auth=${sysenv.SIGGEN_ADMIN_PASSWORD}

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Itest/fakes
